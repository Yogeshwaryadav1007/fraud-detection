global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraud-services
    static_configs:
      - targets:
          - api-gateway:9100
          - ingestion:9101
          - enrichment:9102
          - rule-engine:9103
          - ml-service:9104
          - graph-service:9105
          - risk-scoring:9106
          - audit:9107
          - notification:9108
          - case-management:9109
