apiVersion: v1
kind: ConfigMap
metadata: {name: fraud-config, namespace: fraud}
data:
  KAFKA_BOOTSTRAP: "kafka-bootstrap.fraud.svc.cluster.local:9092"
  REDIS_URL: "redis://redis.fraud.svc.cluster.local:6379/0"
  NEO4J_URI: "bolt://neo4j.fraud.svc.cluster.local:7687"
  ELASTIC_URL: "http://elasticsearch.fraud.svc.cluster.local:9200"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  TRACING_ENABLED: "true"
  LOG_LEVEL: "INFO"
  DECISION_TIMEOUT_MS: "800"
  APPROVE_MAX: "30"
  CHALLENGE_MAX: "60"
  REVIEW_MAX: "85"
---
# In a real cluster this is an ExternalSecret backed by Vault / AWS Secrets
# Manager. Committed here only as a shape reference — never real values.
apiVersion: v1
kind: Secret
metadata: {name: fraud-secrets, namespace: fraud}
type: Opaque
stringData:
  POSTGRES_DSN: "postgresql://fraud:CHANGE_ME@postgres.fraud:5432/fraud"
  NEO4J_PASSWORD: "CHANGE_ME"
  API_KEYS: "CHANGE_ME"
