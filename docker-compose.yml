x-py: &py
  build:
    context: .
    dockerfile: Dockerfile
  environment: &env
    KAFKA_BOOTSTRAP: kafka:29092
    REDIS_URL: redis://redis:6379/0
    POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_PASSWORD: fraudgraph
    ELASTIC_URL: http://elasticsearch:9200
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    TRACING_ENABLED: "true"
    LOG_LEVEL: INFO
  depends_on:
    kafka: {condition: service_healthy}
    redis: {condition: service_started}
    postgres: {condition: service_healthy}
  restart: unless-stopped

services:
  # ---------------------------------------------------------- infrastructure
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment: {ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000}

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/fraudgraph
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./k8s/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]
    environment: {GF_SECURITY_ADMIN_PASSWORD: admin}
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4317:4317"]
    environment: {COLLECTOR_OTLP_ENABLED: "true"}

  # ---------------------------------------------------------- services
  api-gateway:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, target: http, args: {SERVICE: api-gateway}}
    ports: ["8000:8080"]

  ingestion:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, target: http, args: {SERVICE: ingestion}}
    ports: ["8001:8080"]

  enrichment:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: enrichment}}
    deploy: {replicas: 2}

  rule-engine:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: rule-engine}}
    deploy: {replicas: 2}

  ml-service:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: ml-service}}
    environment:
      <<: *env
      MODEL_PATH: /app/ml/model.joblib
    deploy: {replicas: 2}

  graph-service:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: graph-service}}
    depends_on:
      kafka: {condition: service_healthy}
      neo4j: {condition: service_started}

  risk-scoring:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: risk-scoring}}
    deploy: {replicas: 2}

  case-management:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: case-management}}
    ports: ["8002:8080"]

  notification:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: notification}}

  audit:
    <<: *py
    build: {context: ., dockerfile: Dockerfile, args: {SERVICE: audit}}

volumes:
  pgdata:
  neo4jdata:
